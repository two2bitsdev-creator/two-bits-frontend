name: two-bits

services:
  frontend:
    image: ghcr.io/two2bitsdev-creator/two-bits-frontend:${IMAGE_TAG:-latest}
    container_name: two-bits-frontend
    restart: unless-stopped
    # Loopback only — the host's nginx terminates TLS and proxies to this port.
    ports:
      - "127.0.0.1:18420:3000"
