# Host nginx site for two-bits.dev
# Install: /etc/nginx/sites-available/two-bits.dev  (symlinked into sites-enabled)
# Proxies to the frontend container published on 127.0.0.1:18420.

upstream two_bits_frontend {
    server 127.0.0.1:18420;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name two-bits.dev www.two-bits.dev;
    return 301 https://two-bits.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.two-bits.dev;

    ssl_certificate     /etc/ssl/two-bits/cert.pem;
    ssl_certificate_key /etc/ssl/two-bits/key.pem;

    return 301 https://two-bits.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name two-bits.dev;

    ssl_certificate     /etc/ssl/two-bits/cert.pem;
    ssl_certificate_key /etc/ssl/two-bits/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cloudflare edge ranges — restore the real visitor IP from CF-Connecting-IP.
    # Source: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 10m;

    access_log /var/log/nginx/two-bits.access.log;
    error_log  /var/log/nginx/two-bits.error.log;

    location / {
        proxy_pass http://two_bits_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
    }
}
